# Entorno local de desarrollo. No es configuración de producción.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phs_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-phs}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - phs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phs} -d ${POSTGRES_DB:-phs}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  phs_pgdata:
