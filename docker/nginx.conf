# Web de PHS en Docker: sirve la aplicación y reenvía /api al gateway, igual que el proxy de Vite
# en desarrollo. El navegador solo conoce este origen.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Las evidencias admiten archivos de hasta 10 MB.
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Los archivos compilados llevan huella en el nombre: se pueden guardar en caché.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier otra ruta entrega index.html, sin caché.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
