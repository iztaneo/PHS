function readSupportImage(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{draft.supportImage=e.target.result;render()};
  r.readAsDataURL(f);
}
function resolveExpectation(key,type,refId){
  const p=selected(); if(!p)return;
  if(type==='milestone'||type==='milestone-next')return openMilestoneUpdate(refId);
  if(type==='risk'||type==='risk-next')return openRiskUpdate(p.id,refId);
  if(type==='task')return openTaskModal(p.id,refId);
  if(type==='renewal')return openRenewalModal();
  if(type==='financial')return openFinanceModal();
  if(type==='change')return go('changes');
  if(type==='end')return openProjectModal(p.id);
  if(type==='deviation'){
    return modal(`<div class="kicker">Health Gate</div><h2>Desviación de proyecto</h2>
    <div class="desc">Avance comprometido ${fmtPct(plannedProgress(p))} vs. avance real ${fmtPct(actualProgress(p))} · desviación ${fmtPct(projectDeviation(p))}.
    El umbral crítico del PHF es 10%.</div>
    <div class="note">Para cerrar este evento debes actualizar los hitos pendientes, registrar un cambio aprobado que modifique la línea base, o dejar constancia del plan de recuperación en la acción asociada.</div>
    <div class="form-actions"><button class="btn" onclick="closeModal();go('milestones')">Ir a hitos</button>
    <button class="btn primary" onclick="closeModal();go('changes')">Registrar cambio</button></div>`,'small');
  }
  if(type==='review'){toast('Estás ejecutando la revisión: completa el formulario y confirma');return}
  go('health');
}
function submitReview(){
  const p=selected(); if(!p)return;
  const d=ensureDraft(p);
  const exp=expectations(p);
  const red=exp.filter(e=>e.severity==='red');
  if(!d.nothing&&!d.topics.length){toast('Indica qué cambió o marca “Nada cambió”');return}
  if(d.nothing&&red.length){toast('No puedes cerrar con “nada cambió”: hay eventos que requieren tratamiento');return}
  if(p.cycle.evidenceRequired&&!d.supportText&&!d.supportImage&&!d.nothing){
    toast('El ciclo exige soporte: agrega un comentario o una imagen');return;
  }
  if(d.topics.includes('Finanzas')){
    if(d.cost!==null&&d.cost!==undefined)p.finance.cost=Number(d.cost);
    if(d.effort!==null&&d.effort!==undefined)p.finance.effortActual=Number(d.effort);
  }
  const a=assess(p);
  const seconds=Math.max(1,Math.round((Date.now()-d.started)/1000));
  const id=nextId('HR');
  const rec={id,date:state.today,author:p.pm,topics:d.topics.slice(),nothing:d.nothing,
    climate:d.climate||(p.reviews[0]?p.reviews[0].climate:''),
    supportText:d.supportText,supportImage:d.supportImage,
    confidence:d.confidence||a.confidence.level,confidenceValue:a.confidence.value,
    health:a.score,dims:a.dims.reduce((o,x)=>{o[x.key]=x.score;return o},{}),
    gates:a.active.map(g=>g.label),expected:exp.length,seconds,
    status:p.cycle.leaderValidation?'Pendiente de validación':'Cerrada',validation:null};
  p.reviews.unshift(rec);
  p.cycle.last=state.today;
  p.cycle.next=nextByCadence(state.today,p.cycle.cadence);
  logEvent(p,'Health Review',`${id} registrada · score ${a.score}/100 · ${seconds}s · ${rec.status.toLowerCase()}.`,healthClass(a.score));
  snapshotScores('review');
  draft=null; stopTimer();
  page='health'; render();
  toast(`Health Review ${id} registrada en ${seconds}s`);
}

let timerHandle=null;
function startTimer(){
  if(timerHandle)return;
  timerHandle=setInterval(()=>{
    const el=byId('revTimer');
    if(!el||!draft){return}
    const s=Math.round((Date.now()-draft.started)/1000);
    el.textContent='⏱ '+s+'s';

  },1000);
}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}

function setRole(r){
  state.role=r;

    /* líder y dirección aterrizan en su vista de gobierno */
  }

/* =========================================================
   PANELES: ALERTAS Y SIMULACIÓN
   ========================================================= */
function renderBell(){
  const a=alerts(), el=byId('bellPanel');
  el.innerHTML=`<div class="panel-head"><b>Alertas y prioridades</b>
    <div style="display:flex;gap:6px;align-items:center"><button class="btn tiny" onclick="closePanels();go('alerts')">Ver todas</button>
    <button class="panel-close" onclick="closePanels()">×</button></div></div>
  ${a.length?a.slice(0,14).map(x=>`<button class="bell-item ${x.level}" onclick="openAlert('${x.projectId}','${x.target}')">
    <span class="sev"></span><div><b>${esc(x.title)}</b><p>${esc(x.projectName)} · ${esc(x.text)}</p></div></button>`).join('')
  :`<div class="empty sm"><h3>Sin alertas activas</h3><p>El sistema genera alertas cuando se acercan o vencen hitos, riesgos, acciones, revisiones o renovaciones.</p></div>`}`;
}
function renderSim(){
  const el=byId('simPanel');
  const real=todayISO();
  el.innerHTML=`<div class="panel-head"><b>Fecha operativa · pruebas</b><button class="panel-close" onclick="closePanels()">×</button></div>
  <div class="sim-date"><strong>${dateFmt(state.today)}</strong><span>Fecha usada para vencimientos, ciclos y alertas${state.today!==real?' · simulada':''}</span></div>
  <div class="sim-grid"><button onclick="advance(1)">+1 día</button><button onclick="advance(3)">+3 días</button><button onclick="advance(7)">+7 días</button><button onclick="advance(14)">+14 días</button></div>
  <div class="sim-grid"><button onclick="advance(30)">+30 días</button><button onclick="advance(-1)">−1 día</button><button onclick="advance(-7)">−7 días</button><button onclick="resetDate()">Hoy</button></div>
  <div class="sim-sec"><div class="sectitle">Fecha específica</div>
    <div style="display:flex;gap:7px"><input type="date" id="simDate" value="${state.today}" style="flex:1;background:#fbfbfd;border:1px solid #d9d9de;border-radius:12px;padding:9px 11px;font-size:12px">
    <button class="btn small primary" onclick="setOpDate()">Aplicar</button></div></div>
  <div class="sim-sec"><div class="sectitle">Datos de prueba</div>
    <button class="btn small" style="width:100%;justify-content:center" onclick="loadDemo()">Cargar escenario de 3 proyectos</button>
    <div class="hint" style="margin-top:8px;font-size:10px;color:#8d8d92">Genera proyectos con hitos vencidos, riesgos, desviaciones y renovaciones para ver el modelo completo en operación.</div></div>`;
}
function advance(n){
  state.today=addDays(state.today,n);
  snapshotScores('avance de fecha');
  logEvent(null,'Fecha operativa',`La fecha operativa se movió ${n>0?'+':''}${n} día(s) → ${dateFmt(state.today)}.`,'info');
  closePanels(); render();
  toast(`Fecha operativa: ${dateFmt(state.today)}`);
}
function setOpDate(){
  const d=v('simDate'); if(!d)return;
  state.today=d; snapshotScores('fecha manual');
  logEvent(null,'Fecha operativa',`Fecha operativa establecida en ${dateFmt(d)}.`,'info');
  closePanels(); render(); toast('Fecha operativa actualizada');
}
function resetDate(){
  state.today=todayISO(); snapshotScores('fecha real');
  closePanels(); render(); toast('Fecha operativa restaurada a hoy');
}
function closePanels(){
  byId('bellPanel').classList.remove('open');
  byId('simPanel').classList.remove('open');
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  if(state.selected&&!state.projects.find(p=>p.id===state.selected))state.selected=null;
  if(!state.selected&&state.projects.length)state.selected=state.projects[0].id;
  syncEngine();
  navRender();
  byId('roleSwitch').innerHTML=ROLES.map(r=>`<button class="${state.role===r.key?'active':''}" onclick="setRole('${r.key}')" title="${r.full}">${r.label}</button>`).join('');
  const p=selected();
  byId('contextName').textContent=p?p.name:'Sin proyecto seleccionado';
  byId('contextMeta').textContent=p?`· ${p.client||p.type}`:'· selecciona uno';
  byId('opDate').textContent=dateFmt(state.today);
  byId('simBtn').className='datechip'+(state.today!==todayISO()?' sim':'');
  const a=alerts(), badge=byId('alertBadge');
  badge.textContent=a.length; badge.style.display=a.length?'grid':'none';
  const view=views[page]||views.center;
  byId('content').innerHTML=view();
  renderBell(); renderSim(); save();
  if(page==='review'&&selected()&&selected().cycle.cadence)startTimer(); else stopTimer();
}
