<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Health System — PHF</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#fbfbfd;--surface3:#f3f4f7;
  --ink:#1d1d1f;--ink2:#3a3a3d;--muted:#6e6e73;--faint:#9a9aa0;
  --line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.055);
  --blue:#0071e3;--blue2:#2997ff;--blueSoft:#eef6ff;
  --green:#1a9b59;--greenSoft:#eaf7ef;
  --amber:#c97a00;--amberSoft:#fff5e6;
  --red:#d92d20;--redSoft:#fff0ee;
  --purple:#6b5bd2;--purpleSoft:#f1effc;
  --teal:#0f9b98;--tealSoft:#e8f7f7;
  --shadow:0 18px 55px rgba(0,0,0,.07);--shadow2:0 8px 26px rgba(0,0,0,.06);
  --radius:22px;--sidebar:252px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:transparent;color:inherit}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9c9cf;border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ---------- LAYOUT ---------- */
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:24px 14px 96px;background:rgba(248,248,250,.9);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--line);z-index:50;overflow-y:auto}
.brand{padding:0 10px 20px;font-size:17px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;margin-top:4px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{color:#515154;text-align:left;padding:9px 11px;border-radius:11px;display:flex;align-items:center;gap:10px;font-size:12.5px;width:100%;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.8)}
.nav button.active{background:#fff;color:#111;box-shadow:0 5px 18px rgba(0,0,0,.06);font-weight:700}
.nav button .count{margin-left:auto;font-size:9.5px;font-weight:800;background:#e9e9ee;color:#5a5a60;border-radius:99px;padding:2px 6px;min-width:18px;text-align:center}
.nav button .count.red{background:var(--red);color:#fff}
.nav button .count.amber{background:var(--amber);color:#fff}
.nav svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;flex:0 0 16px}
.nav .section{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:#9a9aa0;font-weight:800;padding:18px 11px 6px}
.nav .section.first{padding-top:6px}
.sidebar-foot{position:fixed;left:0;bottom:0;width:var(--sidebar);padding:12px 14px 16px;background:rgba(248,248,250,.96);border-right:1px solid var(--line);border-top:1px solid var(--line2);backdrop-filter:blur(20px)}
.sidebar-foot button{width:100%;color:#6e6e73;padding:9px 11px;border-radius:11px;text-align:left;font-size:11.5px;display:flex;gap:8px;align-items:center}
.sidebar-foot button:hover{background:#fff}

.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:66px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 30px;background:rgba(245,245,247,.84);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line2)}
.context{display:flex;align-items:center;gap:10px;min-width:0}
.projpick{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);max-width:min(46vw,460px)}
.projpick:hover{background:#fff}
.projpick b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projpick span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.projpick svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;opacity:.5;flex:0 0 14px}
.top-actions{display:flex;align-items:center;gap:8px}
.roleswitch{display:flex;gap:2px;background:#e8e8ed;border-radius:999px;padding:3px}
.roleswitch button{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;color:#5a5a60}
.roleswitch button.active{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.09)}
.iconbtn{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#404043;transition:.15s}
.iconbtn:hover{background:#fff;transform:translateY(-1px)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.alert-dot{position:absolute;right:-2px;top:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.datechip{height:38px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);padding:0 13px;display:flex;align-items:center;gap:7px;font-size:11px;color:#4c4c50;transition:.15s}
.datechip:hover{background:#fff;transform:translateY(-1px)}
.datechip b{font-size:11px}
.datechip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.datechip.sim{border-color:#f0c894;background:#fff8ec;color:#8a5a00}

.content{max-width:1420px;margin:0 auto;padding:38px 34px 90px}
.pagehead{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.pagehead h1{font-size:34px;line-height:1.06;letter-spacing:-.04em;margin:0}
.pagehead .kicker{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.pagehead p{margin:9px 0 0;color:var(--muted);font-size:13px;max-width:780px;line-height:1.5}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- COMPONENTS ---------- */
.btn{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 15px;color:#222;font-size:12px;font-weight:700;transition:.16s ease;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.07)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#0077ed}
.btn.dark{background:#1d1d1f;border-color:#1d1d1f;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(217,45,32,.3)}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:6px 11px;font-size:11px}
.btn.tiny{padding:5px 9px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface2)}
.card.pad0{padding:0;overflow:hidden}
.card.pad0 .toolbar{padding:20px 22px 0}
.card.pad0 .table{margin-top:12px}
.span12{grid-column:1/-1}.span9{grid-column:span 9}.span8{grid-column:span 8}.span7{grid-column:span 7}
.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}
.card h2{font-size:17px;letter-spacing:-.02em;margin:0}
.card h3{font-size:13px;margin:0}
.card .sub{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}
.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sectitle{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

.metric{font-size:32px;letter-spacing:-.045em;font-weight:780;line-height:1}
.metric.sm{font-size:24px}
.metric-label{font-size:10.5px;color:var(--muted);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#f1f2f4;font-size:10px;font-weight:800;color:#4a4a4f;white-space:nowrap}
.pill.green{background:var(--greenSoft);color:#167442}
.pill.amber{background:var(--amberSoft);color:#8a5300}
.pill.red{background:var(--redSoft);color:#b42318}
.pill.blue{background:var(--blueSoft);color:#075eab}
.pill.purple{background:var(--purpleSoft);color:#4b3cb0}
.pill.teal{background:var(--tealSoft);color:#0a7a78}
.pill.outline{background:transparent;border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#f1f2f4;font-size:9.5px;font-weight:700;color:#5a5a60;margin:2px 3px 2px 0}

.stack{display:grid;gap:10px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.statline.c3{grid-template-columns:repeat(3,1fr)}
.statline.c2{grid-template-columns:repeat(2,1fr)}
.statline.c5{grid-template-columns:repeat(5,1fr)}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
.stat b{font-size:21px;letter-spacing:-.03em;line-height:1.1;display:block}
.stat span{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.35}
.stat.click{cursor:pointer;transition:.15s}
.stat.click:hover{transform:translateY(-2px);box-shadow:var(--shadow2);background:#fff}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}.stat.green b{color:var(--green)}.stat.blue b{color:var(--blue)}

/* health ring */
.health-ring{width:118px;height:118px;flex:0 0 118px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--health)*1%),#ececef 0);display:grid;place-items:center;position:relative}
.health-ring:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.health-ring strong{position:relative;z-index:1;font-size:30px;letter-spacing:-.04em}
.health-ring small{position:relative;z-index:1;font-size:8.5px;color:var(--muted);display:block;text-align:center;margin-top:-2px}
.health-ring.sm{width:74px;height:74px;flex:0 0 74px}
.health-ring.sm:after{inset:8px}
.health-ring.sm strong{font-size:20px}
.healthbox{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.healthcopy h2{font-size:20px;margin:8px 0 5px}
.healthcopy p{color:var(--muted);font-size:11.5px;margin:0;line-height:1.5}

/* dimension bars */
.dims{display:grid;gap:11px}
.dim{display:grid;grid-template-columns:130px 1fr 42px;gap:12px;align-items:center}
.dim .nm{font-size:11.5px;font-weight:650}
.dim .nm small{display:block;color:var(--faint);font-size:9px;font-weight:600;margin-top:1px}
.bar{height:7px;border-radius:99px;background:#ececef;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.dim .vl{font-size:12px;font-weight:800;text-align:right}
.dim.nodata .vl{color:var(--faint);font-weight:700;font-size:10px}

/* gates */
.gates{display:grid;gap:8px}
.gate{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.gate.on{border-color:rgba(217,45,32,.35);background:var(--redSoft)}
.gate .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#e6e7ea;color:#7a7a80}
.gate.on .ic{background:var(--red);color:#fff}
.gate b{font-size:11.5px;display:block}
.gate small{font-size:10px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}

/* tables */
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line2);font-size:11.5px;vertical-align:middle}
.table th{color:#8b8b90;text-transform:uppercase;letter-spacing:.06em;font-size:9px;font-weight:800;white-space:nowrap}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:#fafafc}
.table .actions-cell{white-space:nowrap;text-align:right}
.table td b{font-size:12px}
.table td .mini{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.tablewrap{overflow-x:auto}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form.c1{grid-template-columns:1fr}
.form.c3{grid-template-columns:repeat(3,1fr)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:750;color:#55555a}
.field label .req{color:var(--red)}
.field .hint{font-size:10px;color:var(--faint);line-height:1.4}
.field input,.field select,.field textarea{width:100%;background:#fbfbfd;border:1px solid #d9d9de;border-radius:12px;padding:10px 12px;outline:none;font-size:12.5px;color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7ab8f5;box-shadow:0 0 0 3px rgba(0,113,227,.1);background:#fff}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input[type=file]{padding:8px;background:#fff;font-size:11px}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.form-actions.between{justify-content:space-between}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.switch:last-child{border-bottom:0}
.switch b{font-size:12px}
.switch small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.45}
.toggle{width:42px;height:24px;flex:0 0 42px;border-radius:999px;background:#d1d1d6;padding:2px;transition:.2s}
.toggle:before{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#34c759}
.toggle.on:before{transform:translateX(18px)}
.segment{display:flex;gap:7px;flex-wrap:wrap}
.segment button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:650;transition:.15s}
.segment button:hover{border-color:#b9d8f8}
.segment button.active{border-color:#8fc4f7;background:var(--blueSoft);color:#075eab;font-weight:800}
.segment button.active.red{border-color:#f3b0a8;background:var(--redSoft);color:#b42318}
.segment button.active.amber{border-color:#f0cd94;background:var(--amberSoft);color:#8a5300}
.segment button.active.green{border-color:#9dd8b8;background:var(--greenSoft);color:#167442}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:650;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip .bx{width:14px;height:14px;border-radius:4px;border:1.5px solid #c5c5cc;display:grid;place-items:center;font-size:9px;color:transparent}
.chip.on{border-color:#8fc4f7;background:var(--blueSoft);color:#075eab;font-weight:800}
.chip.on .bx{background:var(--blue);border-color:var(--blue);color:#fff}

/* lists */
.empty{padding:52px 20px;text-align:center}
.empty.sm{padding:28px 16px}
.empty-icon{width:52px;height:52px;border-radius:16px;margin:0 auto 15px;background:linear-gradient(145deg,#f3f5f9,#fff);border:1px solid var(--line);display:grid;place-items:center;color:#8a8a90}
.empty-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty h3{font-size:16px;margin:0 0 7px}
.empty p{max-width:470px;margin:0 auto 18px;color:var(--muted);font-size:12px;line-height:1.55}
.project-list{display:grid;gap:10px}
.project-row{display:grid;grid-template-columns:minmax(220px,1.5fr) 128px 118px 130px 130px 34px;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.16s;cursor:pointer;text-align:left;width:100%}
.project-row:hover{transform:translateY(-1px);box-shadow:var(--shadow2);border-color:#d5e6f8}
.project-row .name{font-size:12.5px;font-weight:750}
.project-row .meta{font-size:10px;color:var(--muted);margin-top:3px}
.project-row .colhead{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:800}
.rowlink{font-size:17px;color:#aaaab0;text-align:right}

/* alerts */
.alerts-list{display:grid;gap:9px}
.alert-card{display:grid;grid-template-columns:9px 1fr auto;gap:13px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.15s}
.alert-card:hover{box-shadow:var(--shadow2)}
.alert-card .sev{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#c9c9cf}
.alert-card.red{border-color:rgba(217,45,32,.22)}
.alert-card.red .sev{background:var(--red)}
.alert-card.amber .sev{background:var(--amber)}
.alert-card.blue .sev{background:var(--blue)}
.alert-card b{font-size:12px}
.alert-card p{margin:4px 0 0;color:var(--muted);font-size:10.5px;line-height:1.5}
.alert-card .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* timeline */
.timeline{position:relative;margin-left:6px;padding-left:22px;border-left:1px solid #dededf}
.event{position:relative;padding:0 0 18px}
.event:last-child{padding-bottom:0}
.event:before{content:"";position:absolute;left:-27px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #8bbef2}
.event.red:before{border-color:var(--red)}
.event.amber:before{border-color:var(--amber)}
.event.green:before{border-color:var(--green)}
.event b{font-size:11.5px}
.event .when{font-size:9.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.event p{margin:4px 0 0;color:var(--muted);font-size:10.5px;line-height:1.5}
.tl-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tl-col{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface2)}
.tl-col h3{font-size:12px;margin:0 0 3px}
.tl-col .sub{font-size:10px;color:var(--muted);margin-bottom:13px}
.tl-item{padding:10px 0;border-bottom:1px solid var(--line2);font-size:11px}
.tl-item:last-child{border-bottom:0}
.tl-item b{display:block;font-size:11.5px}
.tl-item span{display:block;color:var(--muted);font-size:10px;margin-top:3px}

/* review */
.review-box{display:grid;gap:12px}
.review-item{border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--surface2)}
.review-item>label{display:block;font-size:11.5px;font-weight:750;margin-bottom:4px}
.review-item .qhint{font-size:10px;color:var(--muted);margin-bottom:11px;line-height:1.45}
.expect{border:1px solid #f0cd94;background:#fffaf1;border-radius:16px;padding:15px}
.expect.none{border-color:#9dd8b8;background:var(--greenSoft)}
.expect h3{font-size:12px;margin:0 0 4px}
.expect .sub{font-size:10.5px;color:#7a6033;margin-bottom:12px}
.expect.none .sub{color:#256b48}
.expect-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.expect-item:last-child{margin-bottom:0}
.expect-item b{font-size:11.5px;display:block}
.expect-item small{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.expect-item.done{opacity:.55}
.inconsist{border:1px solid rgba(217,45,32,.3);background:var(--redSoft);border-radius:14px;padding:13px 15px;margin-top:10px}
.inconsist b{font-size:11.5px;color:#b42318;display:block;margin-bottom:4px}
.inconsist p{margin:0;font-size:10.5px;color:#8a3128;line-height:1.5}
.timerpill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:#1d1d1f;color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.timerpill.over{background:var(--amber)}

/* steps / flow */
.flow{display:grid;gap:10px}
.flowstep{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;width:100%;transition:.15s}
.flowstep:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
.flowstep .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--blueSoft);color:#075eab}
.flowstep b{font-size:13px;display:block}
.flowstep .role{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:3px;display:block}
.flowstep p{margin:5px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.catitem{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;text-align:left;transition:.15s}
.catitem:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:#cfe3f7}
.catitem b{font-size:11.5px;display:block}
.catitem span{font-size:9.5px;color:var(--faint);display:block;margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* tabs */
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px;background:#e9e9ee;padding:4px;border-radius:14px;width:fit-content;max-width:100%}
.tabs button{padding:8px 14px;border-radius:11px;font-size:11.5px;font-weight:700;color:#5a5a60}
.tabs button.active{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* panels */
.bell-panel,.sim-panel{position:fixed;right:22px;top:60px;width:396px;max-width:calc(100vw - 32px);max-height:74vh;overflow:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.17);z-index:100;padding:14px;display:none}
.bell-panel.open,.sim-panel.open{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;gap:10px}
.panel-head b{font-size:14px}
.panel-close{font-size:19px;color:#8a8a90;line-height:1;padding:0 4px}
.bell-item{padding:11px 12px;border-radius:14px;display:grid;grid-template-columns:8px 1fr;gap:10px;width:100%;text-align:left;transition:.12s}
.bell-item:hover{background:#f6f6f8}
.bell-item .sev{width:7px;height:7px;border-radius:50%;margin-top:4px;background:#c9c9cf}
.bell-item.red .sev{background:var(--red)}
.bell-item.amber .sev{background:var(--amber)}
.bell-item.blue .sev{background:var(--blue)}
.bell-item b{font-size:11.5px;display:block}
.bell-item p{margin:3px 0 0;color:var(--muted);font-size:9.5px;line-height:1.45}
.sim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.sim-grid button{padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:10.5px;font-weight:700;transition:.15s}
.sim-grid button:hover{background:var(--blueSoft);border-color:#a8d1f7}
.sim-date{padding:12px;border-radius:14px;background:#f6f6f8;margin-bottom:11px;text-align:center}
.sim-date strong{display:block;font-size:16px;letter-spacing:-.02em}
.sim-date span{font-size:9.5px;color:var(--muted)}
.sim-sec{border-top:1px solid var(--line2);margin-top:12px;padding-top:12px}
.sim-sec .sectitle{margin-bottom:9px}

/* modal */
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.26);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modalback.open{display:flex}
.modal{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;border:1px solid rgba(0,0,0,.08);box-shadow:0 32px 90px rgba(0,0,0,.24);padding:26px}
.modal.small{width:min(470px,96vw)}
.modal.wide{width:min(1000px,96vw)}
.modal h2{font-size:22px;letter-spacing:-.03em;margin:0 0 6px}
.modal .desc{font-size:11.5px;color:var(--muted);margin-bottom:20px;line-height:1.55}
.modal .kicker{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:7px}
.deffield{margin-bottom:15px}
.deffield b{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);display:block;margin-bottom:4px}
.deffield p{margin:0;font-size:12px;line-height:1.6;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:300;background:#1d1d1f;color:#fff;border-radius:999px;padding:11px 17px;font-size:11.5px;font-weight:700;transition:.25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.evimg{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px;display:block}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.note{font-size:10.5px;color:var(--muted);line-height:1.55;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.note b{color:var(--ink2)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:11.5px}
.kv dt{color:var(--muted);font-weight:650}
.kv dd{margin:0;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sparks{display:flex;align-items:flex-end;gap:4px;height:56px}
.sparks i{flex:1;border-radius:4px 4px 0 0;background:#d6e8fa;min-height:3px;position:relative}
.sparks i.green{background:#a9e0c3}.sparks i.amber{background:#f6d6a1}.sparks i.red{background:#f5b6ae}
.bignum{display:flex;align-items:baseline;gap:8px}
.bignum b{font-size:30px;letter-spacing:-.04em}
.bignum span{font-size:11px;color:var(--muted)}
.trend{font-size:13px;font-weight:800}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.flat{color:var(--muted)}

@media(max-width:1180px){
  .statline,.statline.c5{grid-template-columns:repeat(2,1fr)}
  .tl-cols{grid-template-columns:1fr}
  .span3,.span4,.span5,.span6,.span7,.span8,.span9{grid-column:1/-1}
}
@media(max-width:900px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-100%);transition:.25s;width:252px}
  .sidebar.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.25)}
  .sidebar-foot{display:none}
  .main{margin-left:0}
  .content{padding:28px 18px 70px}
  .topbar{padding:0 16px;gap:8px}
  .roleswitch button{padding:6px 9px;font-size:10px}
  .pagehead h1{font-size:27px}
  .form,.form.c3{grid-template-columns:1fr}
  .project-row{grid-template-columns:1fr 34px}
  .project-row .hide-md{display:none}
  .dim{grid-template-columns:110px 1fr 38px}
  .menubtn{display:grid!important}
}
.menubtn{display:none}
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Project Health System<small>PHF · gobierno de salud de proyectos</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="sidebar-foot">
    <button id="resetBtn">↺ Reiniciar prototipo</button>
  </div>
  <main class="main">
    <header class="topbar">
      <div class="context">

      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="bell-panel" id="bellPanel"></div>
<div class="sim-panel" id="simPanel"></div>
<div class="modalback" id="modalBack"></div>

const KEY='phs_state_v5';

function todayISO(){return new Date().toISOString().slice(0,10)}
function emptyState(){return{
  today:todayISO(),
  role:'pm',
  projects:[],
  history:[],
  selected:null,
  seq:{HR:1,T:1,C:1,E:1},
  page:'center',
  tab:{}
}}

let state=load();
let page=state.page||'center';
let draft={};      // borrador de Health Review en curso
let reviewTimer=null;

function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(!raw||!Array.isArray(raw.projects))return emptyState();
    const base=emptyState();
    return Object.assign(base,raw,{seq:Object.assign(base.seq,raw.seq||{})});
  }catch(e){return emptyState()}
}
function save(){try{state.page=page;localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(p){return p+'-'+Math.random().toString(36).slice(2,8)}
function nextId(p){const n=state.seq[p]||1;state.seq[p]=n+1;return p+'-'+String(n).padStart(3,'0')}
function clamp(n,a,b){return Math.max(a===undefined?0:a,Math.min(b===undefined?100:b,n))}
function round(n){return Math.round(n)}
function sum(a){return a.reduce((x,y)=>x+y,0)}
function byId(id){return document.getElementById(id)}
function v(id){const e=byId(id);return e?String(e.value||'').trim():''}
function vnum(id){const s=v(id).replace(/[^0-9.\-]/g,'');return s===''?null:Number(s)}
function checked(id){const e=byId(id);return e?e.classList.contains('on'):false}

function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function daysUntil(date){if(!date)return null;return Math.round((new Date(date+'T12:00:00')-new Date(state.today+'T12:00:00'))/86400000)}
function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function dateFmt(x){if(!x)return '—';try{return new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(x+'T12:00:00'))}catch(e){return x}}
function dateShort(x){if(!x)return '—';try{return new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'short'}).format(new Date(x+'T12:00:00'))}catch(e){return x}}
function relDays(d){if(d===null)return '—';if(d<0)return `hace ${Math.abs(d)} d`;if(d===0)return 'hoy';return `en ${d} d`}
function fmtMoney(n){if(n===null||n===undefined||n==='')return '—';return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n)}
function fmtPct(n){if(n===null||n===undefined||isNaN(n))return '—';return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,'')+'%'}
function cadenceDays(c){return CADENCES[c]||14}
function nextByCadence(date,cadence){return addDays(date,cadenceDays(cadence))}

function selected(){return state.projects.find(p=>p.id===state.selected)||null}
function requireProject(){const p=selected();if(p)return p;return null}
function role(){return state.role}
function roleObj(){return ROLES.find(r=>r.key===state.role)||ROLES[0]}

function isDone(m){return m.status==='Cumplido'}
function isOverdue(m){return !isDone(m)&&m.date&&daysUntil(m.date)<0}
function openRisks(p){return p.risks.filter(r=>!['Mitigado','Cerrado'].includes(r.status))}
function riskSeverity(r){const pp={'Baja':1,'Media':2,'Alta':3}[r.probability]||1;const ii={'Bajo':1,'Medio':2,'Alto':3}[r.impact]||1;return pp*ii}
function riskLevel(r){const s=riskSeverity(r);return s>=6?'red':s>=3?'amber':'blue'}
function openTasks(p){return p.tasks.filter(t=>t.status!=='Completada')}
function overdueTasks(p){return openTasks(p).filter(t=>t.deadline&&daysUntil(t.deadline)<0)}
function currentBaseline(p){const ap=p.baselines.filter(b=>b.status==='Vigente');return ap.length?ap[ap.length-1]:(p.baselines[p.baselines.length-1]||null)}
function pendingReviews(p){return p.reviews.filter(r=>r.status==='Pendiente de validación')}

function projectsForRole(){
  // El prototipo simula alcance por rol: el PM ve sus proyectos; líder y dirección ven todo.
  return state.projects;
}

function newProjectShell(d){
  return {
    id:uid('P'), code:d.code||('PRJ-'+String(state.projects.length+1).padStart(3,'0')),
    name:d.name, client:d.client, clientContact:d.clientContact||'', escalation:d.escalation||'',

    baselines:[], cycle:Object.assign({},CYCLE_DEFAULT),

function logEvent(p,kind,text,level){
  const rec={id:uid('L'),date:state.today,kind,text,level:level||'info',project:p?p.id:null,projectName:p?p.name:'Sistema'};

function toast(msg){const t=byId('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

/* =========================================================
   HEALTH MODEL — métricas, dimensiones, gates y score
   Reglas deterministas y transparentes (MVP del PHF).
   ========================================================= */

/* Avance comprometido según baseline vigente + cambios aprobados */
function plannedProgress(p){
  const ms=p.milestones;
  if(!ms.length){
    if(!p.start||!p.end)return null;
    const total=daysBetween(p.start,p.end);
    if(total<=0)return null;
    return clamp(daysBetween(p.start,state.today)/total*100);
  }
  const due=ms.filter(m=>m.date&&daysUntil(m.date)<=0).length;
  return due/ms.length*100;
}
function actualProgress(p){
  const ms=p.milestones;
  if(!ms.length)return null;
  const done=ms.filter(isDone).length;
  const running=ms.filter(m=>m.status==='En curso').length;
  return (done+running*0.5)/ms.length*100;
}
/* Desviación de proyecto: puntos porcentuales de avance comprometido no cumplido */
function projectDeviation(p){
  const pl=plannedProgress(p), ac=actualProgress(p);
  if(pl===null||ac===null)return 0;
  return Math.max(0,pl-ac);
}
/* Desviación financiera: costo real vs. presupuesto de la línea base vigente */
function financialDeviation(p){
  const b=currentBaseline(p);
  const budget=(b&&b.budget!==null&&b.budget!==undefined&&b.budget!=='')?Number(b.budget):(p.finance.budget!==null?Number(p.finance.budget):null);
  const cost=Number(p.finance.cost||0);
  if(!budget||budget<=0)return null;
  /* comparación proporcional al avance del calendario para no penalizar consumo normal */
  const elapsed=(p.start&&p.end&&daysBetween(p.start,p.end)>0)?clamp(daysBetween(p.start,state.today)/daysBetween(p.start,p.end)*100,0,100):100;
  const expected=budget*(elapsed/100);
  if(expected<=0)return cost>0?100:0;
  return (cost-expected)/budget*100;
}
function effortDeviation(p){
  const b=currentBaseline(p);
  const planned=(b&&b.effort)?Number(b.effort):(p.finance.effortPlanned||null);
  if(!planned||planned<=0)return null;
  return (Number(p.finance.effortActual||0)-planned)/planned*100;
}
function daysSinceReview(p){
  const last=p.cycle.last||(p.reviews[0]&&p.reviews[0].date);
  if(!last)return null;
  return Math.abs(daysBetween(last,state.today));
}
function reviewOverdue(p){
  if(!p.cycle.next)return false;
  return daysUntil(p.cycle.next)<0;
}

/* ---------- Dimensiones (null = sin dato suficiente) ---------- */
function dimSchedule(p){
  if(!p.milestones.length)return null;
  let s=100;
  const overdue=p.milestones.filter(isOverdue);
  const soon=p.milestones.filter(m=>!isDone(m)&&m.date&&daysUntil(m.date)>=0&&daysUntil(m.date)<=3);
  s-=overdue.length*20;
  s-=overdue.filter(m=>m.critical).length*8;
  s-=soon.length*4;
  s-=Math.min(35,projectDeviation(p)*1.6);
  s-=p.milestones.filter(m=>isDone(m)&&m.completedDate&&m.completedDate>m.date).length*5;
  s-=p.milestones.filter(m=>m.status==='Reprogramado'&&!m.approvedChange).length*6;
  return clamp(s);
}
function dimFinancial(p){
  const dev=financialDeviation(p);
  if(dev===null)return null;
  let s=100;
  if(dev>0)s-=Math.min(75,dev*7.5);
  const ed=effortDeviation(p);
  if(ed!==null&&ed>0)s-=Math.min(20,ed*1.2);
  return clamp(s);
}
function dimRisks(p){
  if(!p.risks.length)return null;
  let s=100;
  for(const r of p.risks){
    if(r.status==='Materializado'){s-=22;continue}
    if(['Mitigado','Cerrado'].includes(r.status))continue;
    s-=riskSeverity(r)*2;
    const d=daysUntil(r.deadline);
    if(d!==null&&d<0)s-=12;
    else if(d!==null&&d<=3)s-=4;
  }
  return clamp(s);
}
function dimClient(p){
  const last=p.reviews[0];
  const climate=last&&last.climate?last.climate:null;
  const clientRisks=openRisks(p).filter(r=>r.category==='Cliente'||r.type==='Cliente').length;
  if(!climate&&!clientRisks&&!p.clientContact)return null;
  let s=climate==='Crítico'?38:climate==='Con tensión'?68:climate==='Bueno'?100:82;
  s-=clientRisks*10;
  if(!p.clientContact)s-=6;
  if(!p.escalation)s-=4;
  return clamp(s);
}
function dimGovernance(p){
  let s=100;
  if(!p.cycle.cadence)return 40;
  if(!p.reviews.length)s-=30;
  const dsr=daysSinceReview(p);
  const cad=cadenceDays(p.cycle.cadence);
  if(dsr!==null&&dsr>cad)s-=Math.min(40,(dsr-cad)*3);
  if(reviewOverdue(p))s-=Math.min(30,Math.abs(daysUntil(p.cycle.next))*3);
  s-=overdueTasks(p).length*10;
  s-=p.changes.filter(c=>c.status==='Propuesto'&&daysBetween(c.date,state.today)>14).length*8;
  if(p.cycle.evidenceRequired)s-=p.milestones.filter(m=>isDone(m)&&!m.evidence).length*4;
  if(!currentBaseline(p))s-=20;
  return clamp(s);
}
function dimTeam(p){
  if(!p.team.length&&!p.technical)return null;
  let s=100;
  if(!p.team.length)s-=25;
  if(!p.technical)s-=15;
  s-=openRisks(p).filter(r=>r.category==='Equipo').length*14;
  const last=p.reviews[0];
  if(last&&last.topics&&last.topics.includes('Equipo'))s-=8;
  const ed=effortDeviation(p);
  if(ed!==null&&ed>10)s-=10;
  return clamp(s);
}
function dimensionScores(p){
  const fn={schedule:dimSchedule,financial:dimFinancial,risks:dimRisks,client:dimClient,governance:dimGovernance,team:dimTeam};
  return DIMENSIONS.map(d=>({...d,score:fn[d.key](p)}));
}

/* ---------- Health Gates ---------- */
function gateStatus(p){
  const dev=projectDeviation(p), fin=financialDeviation(p);
  const critMs=p.milestones.some(m=>m.critical&&isOverdue(m));
  const critRisk=p.risks.some(r=>r.status==='Materializado'||(!['Mitigado','Cerrado'].includes(r.status)&&riskSeverity(r)>=6&&r.deadline&&daysUntil(r.deadline)<0));
  const last=p.reviews[0];
  const test={
    projDev:dev>10,
    finDev:fin!==null&&fin>3,
    critMs:critMs,
    critRisk:critRisk,
    noReview:reviewOverdue(p),
    clientCrit:!!(last&&last.climate==='Crítico')
  };
  return GATES.map(g=>({...g,on:!!test[g.key]}));
}

/* ---------- Health Score ---------- */
function assess(p){
  const dims=dimensionScores(p);
  const withData=dims.filter(d=>d.score!==null);
  const wsum=sum(withData.map(d=>d.weight));
  let base=wsum>0?sum(withData.map(d=>d.score*d.weight))/wsum:70;
  const gates=gateStatus(p);
  const active=gates.filter(g=>g.on);
  const cap=active.length?Math.min(...active.map(g=>g.cap)):100;
  const score=round(Math.min(base,cap));
  const conf=confidence(p,dims);
  return {score,base:round(base),cap,dims,gates,active,confidence:conf,
          deviation:projectDeviation(p),financial:financialDeviation(p),effort:effortDeviation(p)};
}
function healthLabel(n){return n>=80?'Saludable':n>=60?'En atención':'En riesgo'}
function healthClass(n){return n>=80?'green':n>=60?'amber':'red'}
function healthColor(n){return n>=80?'#1a9b59':n>=60?'#c97a00':'#d92d20'}

/* ---------- Health Confidence ---------- */
function confidence(p,dims){
  let s=100;
  const cad=cadenceDays(p.cycle.cadence||'Quincenal');
  const dsr=daysSinceReview(p);
  if(dsr===null)s-=45;
  else if(dsr>cad*2)s-=45;
  else if(dsr>cad)s-=25;
  else if(dsr>cad*0.75)s-=8;
  const nodata=(dims||dimensionScores(p)).filter(d=>d.score===null).length;
  s-=nodata*8;
  const revs=p.reviews.slice(0,3);
  if(revs.length){
    const noSupport=revs.filter(r=>!r.supportText&&!r.supportImage).length;
    s-=noSupport*9;
  }
  s-=Math.min(24,expectations(p).filter(e=>!e.resolved).length*5);
  if(!currentBaseline(p))s-=12;
  const val=clamp(s);
  return {value:val,level:val>=75?'Alta':val>=50?'Media':'Baja',class:val>=75?'green':val>=50?'amber':'red'};
}

/* ---------- Health Trend ---------- */
function trend(p){
  const sc=p.scores;
  if(sc.length<2)return {dir:'flat',delta:0,label:'Sin histórico suficiente',arrow:'→'};
  const a=sc[sc.length-1].score, b=sc[sc.length-2].score, d=a-b;
  if(d>=3)return {dir:'up',delta:d,label:'Mejorando',arrow:'↑'};
  if(d<=-3)return {dir:'down',delta:d,label:'Deteriorándose',arrow:'↓'};
  return {dir:'flat',delta:d,label:'Estable',arrow:'→'};
}

/* ---------- Health Forecast ---------- */
function forecast(p){
  const cycles=p.cycle.forecastCycles||2;
  const cad=cadenceDays(p.cycle.cadence||'Quincenal');
  const horizon=cad*cycles;
  const limit=addDays(state.today,horizon);
  const ms=p.milestones.filter(m=>!isDone(m)&&m.date&&m.date<=limit&&daysUntil(m.date)>=0);
  const rk=openRisks(p).filter(r=>r.deadline&&r.deadline<=limit&&daysUntil(r.deadline)>=0);
  const tk=openTasks(p).filter(t=>t.deadline&&t.deadline<=limit&&daysUntil(t.deadline)>=0);
  const renew=(p.renewal.date&&p.renewal.date<=limit&&daysUntil(p.renewal.date)>=0)?1:0;
  const t=trend(p);
  let pressure=ms.length*4+ms.filter(m=>m.critical).length*4+sum(rk.map(r=>riskSeverity(r)))*1.2+tk.length*2+renew*6;
  if(t.dir==='down')pressure+=Math.abs(t.delta)*1.2;
  if(projectDeviation(p)>10)pressure+=8;
  const fin=financialDeviation(p); if(fin!==null&&fin>3)pressure+=8;
  const cur=assess(p).score;
  const projected=clamp(round(cur-pressure));
  const label=pressure<8?'Estable':pressure<20?'Riesgo de deterioro':'Deterioro probable';
  return {horizon,limit,cycles,pressure:round(pressure),projected,label,
          drivers:{milestones:ms,risks:rk,tasks:tk,renewal:renew}};
}

/* =========================================================
   EXPECTATION ENGINE — ¿qué debería haber cambiado?
   ========================================================= */
function expectations(p){
  const out=[];
  for(const m of p.milestones){
    if(isDone(m))continue;
    const d=daysUntil(m.date);
    if(d===null)continue;
    if(d<0)out.push({key:'ms-'+m.id,type:'milestone',refId:m.id,severity:'red',
      title:`Hito vencido: ${m.name}`,detail:`Fecha compromiso ${dateFmt(m.date)} · ${relDays(d)}`,
      ask:'Confirma estado, define nueva fecha y adjunta soporte.',resolved:false});
    else if(d<=cadenceDays(p.cycle.cadence||'Quincenal'))out.push({key:'msnext-'+m.id,type:'milestone-next',refId:m.id,severity:d<=3?'amber':'blue',
      title:`Hito próximo: ${m.name}`,detail:`Vence ${relDays(d)} (${dateFmt(m.date)})`,ask:'Confirma si sigue en fecha.',resolved:false});
  }
  for(const r of p.risks){
    if(['Mitigado','Cerrado'].includes(r.status))continue;
    const d=daysUntil(r.deadline);
    if(d===null)continue;
    if(d<0)out.push({key:'rk-'+r.id,type:'risk',refId:r.id,severity:'red',
      title:`Mitigación vencida: ${r.title}`,detail:`Deadline ${dateFmt(r.deadline)} · ${relDays(d)}`,
      ask:'Actualiza probabilidad, estado o deadline.',resolved:false});
    else if(d<=7)out.push({key:'rknext-'+r.id,type:'risk-next',refId:r.id,severity:'amber',
      title:`Mitigación por vencer: ${r.title}`,detail:`Deadline ${relDays(d)}`,ask:'Confirma el avance de la mitigación.',resolved:false});
  }
  for(const t of openTasks(p)){
    const d=daysUntil(t.deadline);
    if(d!==null&&d<0)out.push({key:'tk-'+t.id,type:'task',refId:t.id,severity:'red',
      title:`Acción vencida: ${t.title}`,detail:`Responsable ${t.owner} · ${relDays(d)}`,ask:'Actualiza o cierra la acción.',resolved:false});
  }
  if(p.cycle.next&&daysUntil(p.cycle.next)<0)out.push({key:'rev',type:'review',severity:'red',
    title:'Health Review vencida',detail:`Programada para ${dateFmt(p.cycle.next)} · ${relDays(daysUntil(p.cycle.next))}`,
    ask:'Ejecuta la revisión del ciclo.',resolved:false});
  if(p.renewal.date){
    const d=daysUntil(p.renewal.date);
    if(d!==null&&d<=45&&d>=0)out.push({key:'ren',type:'renewal',severity:d<=15?'amber':'blue',
      title:'Renovación próxima',detail:`${dateFmt(p.renewal.date)} · ${relDays(d)}`,ask:'Confirma la gestión de renovación.',resolved:false});
    else if(d!==null&&d<0)out.push({key:'ren',type:'renewal',severity:'red',
      title:'Renovación vencida',detail:`${dateFmt(p.renewal.date)} · ${relDays(d)}`,ask:'Registra el resultado de la renovación.',resolved:false});
  }
  if(p.end){
    const d=daysUntil(p.end);
    if(d!==null&&d<0&&p.status!=='Cerrado')out.push({key:'end',type:'end',severity:'amber',
      title:'Fecha fin superada',detail:`Fin comprometido ${dateFmt(p.end)} · ${relDays(d)}`,ask:'Cierra el proyecto o registra un cambio aprobado.',resolved:false});
  }
  const dev=projectDeviation(p);
  if(dev>10)out.push({key:'dev',type:'deviation',severity:'red',
    title:'Desviación de proyecto sobre el umbral',detail:`${fmtPct(dev)} de avance comprometido no cumplido`,ask:'Explica la causa y define plan de recuperación.',resolved:false});
  const fin=financialDeviation(p);
  if(fin!==null&&fin>3)out.push({key:'fin',type:'financial',severity:'red',
    title:'Desviación financiera sobre el umbral',detail:`${fmtPct(fin)} sobre la línea base económica`,ask:'Actualiza costo real y explica la desviación.',resolved:false});
  for(const c of p.changes.filter(c=>c.status==='Propuesto'))out.push({key:'ch-'+c.id,type:'change',refId:c.id,severity:'amber',
    title:`Cambio pendiente de decisión: ${c.title}`,detail:`Registrado ${dateFmt(c.date)}`,ask:'Aprueba o rechaza el cambio.',resolved:false});
  const order={red:0,amber:1,blue:2};
  return out.sort((a,b)=>order[a.severity]-order[b.severity]);
}

/* =========================================================
   HEALTH EVENTS — hechos objetivos
   ========================================================= */
const EVENT_RULES=[
  {type:'Hito vencido',      match:e=>e.type==='milestone'},
  {type:'Riesgo vencido',    match:e=>e.type==='risk'},
  {type:'Acción vencida',    match:e=>e.type==='task'},
  {type:'Review vencida',    match:e=>e.type==='review'},
  {type:'Renovación',        match:e=>e.type==='renewal'},
  {type:'Desvío de proyecto',match:e=>e.type==='deviation'},
  {type:'Desvío financiero', match:e=>e.type==='financial'},
  {type:'Cambio de alcance', match:e=>e.type==='change'}
];
function eventTypeFor(e){const r=EVENT_RULES.find(r=>r.match(e));return r?r.type:null}

/* Sincroniza eventos y acciones automáticas (reglas deterministas) */
function syncEngine(){
  for(const p of state.projects){
    const exp=expectations(p);
    for(const e of exp){
      const type=eventTypeFor(e);
      if(!type)continue;
      if(e.severity!=='red'&&type!=='Renovación'&&type!=='Cambio de alcance')continue;
      let ev=p.events.find(x=>x.key===e.key&&x.status!=='Cerrado');
      if(!ev){
        ev={id:nextId('E'),key:e.key,type,date:state.today,title:e.title,detail:e.detail,severity:e.severity,status:'Abierto',taskId:null,refId:e.refId||null};
        p.events.unshift(ev);
        logEvent(p,'Health Event',`${type}: ${e.title}`,e.severity);
      }
      if(p.cycle.autoTasks&&!ev.taskId){
        const t=autoTaskFor(p,ev,e);
        if(t){ev.taskId=t.id}
      }
    }
    // cerrar eventos cuya condición dejó de existir
    for(const ev of p.events){
      if(ev.status==='Cerrado')continue;
      if(!exp.some(e=>e.key===ev.key)){
        ev.status='Cerrado';ev.closedDate=state.today;
        const t=p.tasks.find(t=>t.id===ev.taskId);
        if(t&&t.status!=='Completada'&&t.auto){
          t.status='Completada';t.closedDate=state.today;
          t.closure=(t.closure?t.closure+' · ':'')+'Cerrada automáticamente: la condición que la originó dejó de existir.';
          t.history.unshift({date:state.today,text:'Cierre automático por resolución del evento origen.'});
        }
        logEvent(p,'Health Event',`Cerrado: ${ev.title}`,'green');
      }
    }
    p.events=p.events.slice(0,200);
  }
}

function autoTaskFor(p,ev,e){
  const map={
    'Hito vencido':      {title:t=>`Actualizar estado y nueva fecha del hito`,owner:()=>{const m=p.milestones.find(m=>m.id===e.refId);return m?m.owner:p.pm},due:2,pri:'Alta'},
    'Riesgo vencido':    {title:t=>`Actualizar mitigación del riesgo`,owner:()=>{const r=p.risks.find(r=>r.id===e.refId);return r?r.owner:p.pm},due:2,pri:'Alta'},
    'Acción vencida':    null,
    'Review vencida':    {title:t=>`Ejecutar Health Review del ciclo`,owner:()=>p.pm,due:1,pri:'Alta'},
    'Renovación':        {title:t=>`Preparar renovación del servicio`,owner:()=>p.renewal.owner||p.leader,due:10,pri:'Media'},
    'Desvío de proyecto':{title:t=>`Plan de recuperación de cronograma`,owner:()=>p.pm,due:5,pri:'Alta'},
    'Desvío financiero': {title:t=>`Analizar y explicar desviación financiera`,owner:()=>p.pm,due:5,pri:'Alta'},
    'Cambio de alcance': {title:t=>`Aprobar o rechazar el cambio solicitado`,owner:()=>p.leader,due:7,pri:'Media'}
  };
  const cfg=map[ev.type];
  if(!cfg)return null;
  const t={
    id:nextId('T'),title:`${cfg.title()} — ${ev.title.replace(/^[^:]+:\s*/,'')}`,
    origin:ev.type,originEventId:ev.id,refId:e.refId||null,
    owner:cfg.owner()||p.pm,deadline:addDays(state.today,cfg.due),priority:cfg.pri,
    status:'Pendiente',auto:true,createdDate:state.today,notes:e.ask||'',closure:'',history:[{date:state.today,text:'Acción generada automáticamente por regla del PHS.'}]
  };
  p.tasks.unshift(t);
  logEvent(p,'Health Action',`Acción generada: ${t.title}`,'amber');
  return t;
}

/* =========================================================
   ALERTAS Y PRIORIDADES
   ========================================================= */
function alerts(){
  const out=[];
  for(const p of projectsForRole()){
    for(const e of expectations(p)){
      out.push({projectId:p.id,projectName:p.name,level:e.severity,kind:eventTypeFor(e)||'Seguimiento',
        title:e.title,text:e.detail,ask:e.ask,target:targetFor(e),key:e.key});
    }
  }
  const order={red:0,amber:1,blue:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}
function targetFor(e){
  return ({milestone:'milestones','milestone-next':'milestones',risk:'risks','risk-next':'risks',task:'tasks',
           review:'review',renewal:'core',deviation:'health',financial:'health',change:'changes',end:'core'})[e.type]||'health';
}
function focusAreas(){
  const ps=projectsForRole();
  const f=[
    {key:'red',label:'Proyectos en riesgo',items:ps.filter(p=>assess(p).score<60),target:'portfolio'},
    {key:'amber',label:'Proyectos en atención',items:ps.filter(p=>{const s=assess(p).score;return s>=60&&s<80}),target:'portfolio'},
    {key:'fin',label:'Desviación financiera',items:ps.filter(p=>{const f=financialDeviation(p);return f!==null&&f>3}),target:'portfolio'},
    {key:'norev',label:'Sin Health Review en ciclo',items:ps.filter(p=>reviewOverdue(p)||!p.reviews.length),target:'portfolio'},
    {key:'risk',label:'Riesgos vencidos',items:ps.filter(p=>openRisks(p).some(r=>r.deadline&&daysUntil(r.deadline)<0)),target:'portfolio'},
    {key:'ren',label:'Renovaciones próximas',items:ps.filter(p=>p.renewal.date&&daysUntil(p.renewal.date)!==null&&daysUntil(p.renewal.date)<=45&&daysUntil(p.renewal.date)>=0),target:'portfolio'}
  ];
  return f;
}
function portfolioStats(){
  const ps=projectsForRole();
  const scored=ps.map(p=>({p,a:assess(p)}));
  const avg=scored.length?round(sum(scored.map(x=>x.a.score))/scored.length):0;
  const exposure=sum(ps.map(p=>{const b=currentBaseline(p);const bud=b&&b.budget?Number(b.budget):(p.finance.budget||0);const f=financialDeviation(p);return (f!==null&&f>0)?bud*(f/100):0}));
  return {
    total:ps.length, avg,
    red:scored.filter(x=>x.a.score<60).length,
    amber:scored.filter(x=>x.a.score>=60&&x.a.score<80).length,
    green:scored.filter(x=>x.a.score>=80).length,
    lowConf:scored.filter(x=>x.a.confidence.value<50).length,
    openTasks:sum(ps.map(p=>openTasks(p).length)),
    overdueTasks:sum(ps.map(p=>overdueTasks(p).length)),
    openRisks:sum(ps.map(p=>openRisks(p).length)),
    pendingValidation:sum(ps.map(p=>pendingReviews(p).length)),
    exposure, scored
  };
}
function snapshotScores(reason){
  for(const p of state.projects){
    const a=assess(p);
    const last=p.scores[p.scores.length-1];
    if(last&&last.date===state.today&&last.reason===reason){last.score=a.score;last.confidence=a.confidence.value;continue}
    p.scores.push({date:state.today,score:a.score,confidence:a.confidence.value,reason:reason||'ciclo',
      dims:a.dims.reduce((o,d)=>{o[d.key]=d.score;return o},{}),gates:a.active.map(g=>g.key)});
    p.scores=p.scores.slice(-40);
  }
}

  return `<div class="stack">${f.map(x=>`<div class="alert-card ${x.items.length?(x.key==='red'?'red':'amber'):''}" style="grid-template-columns:9px 1fr auto">

function avgReviewSeconds(){
  const all=state.projects.flatMap(p=>p.reviews.map(r=>r.seconds||0)).filter(x=>x>0);
  return all.length?sum(all)/all.length:0;
}

function ensureDraft(p){
  if(!draft||draft.projectId!==p.id){
    draft={projectId:p.id,topics:[],nothing:false,climate:'',cost:null,effort:null,
           comment:'',supportText:'',supportImage:'',confidence:'',started:Date.now()};
  }
  return draft;
}
views.review=function(){
  const p=selected(); if(!p)return noProject();
  if(!p.cycle.cadence){
    return `${pageHead('Health Review','Revisión del ciclo')}<div class="card">${emptyCard('cycle','Primero configura el ciclo de revisión','La Health Review necesita una cadencia definida para calcular el siguiente ciclo y evaluar la actualidad de la información.',`<button class="btn primary" onclick="go('cycle')">Configurar ciclo</button>`)}</div>`;
  }
  const d=ensureDraft(p);
  const exp=expectations(p);
  const red=exp.filter(e=>e.severity==='red');
  const a=assess(p);
  const inconsistent=d.nothing&&red.length>0;
  const canSubmit=(d.nothing||d.topics.length>0)&&!inconsistent;
  return `${pageHead('Health Review','Revisión del ciclo','El sistema no pregunta lo que ya sabe: primero muestra lo que esperaba que cambiara y sólo pide lo necesario.',
    `<span class="timerpill" id="revTimer">⏱ 0s</span><button class="btn primary" ${canSubmit?'':'disabled'} onclick="submitReview()">Confirmar revisión</button>`)}
  <div class="grid">
    <div class="card span7">
      <div class="review-box">
        <div class="expect ${exp.length?'':'none'}">
          <h3>${exp.length?'Esto es lo que el sistema esperaba que cambiara':'No hay eventos esperados en este ciclo'}</h3>
          <div class="sub">${exp.length?`${red.length} evento(s) crítico(s) de ${exp.length} identificado(s) por el Expectation Engine.`:'Ningún hito, riesgo, acción o compromiso venció ni está por vencer dentro del ciclo.'}</div>
          ${exp.map(e=>`<div class="expect-item">
            <div><b>${esc(e.title)}</b><small>${esc(e.detail)} · ${esc(e.ask)}</small></div>
            <div>${sevPill(e.severity,e.severity==='red'?'Requiere acción':e.severity==='amber'?'Confirmar':'Informativo')}
            <button class="btn tiny" style="margin-left:6px" onclick="resolveExpectation('${e.key}','${e.type}','${e.refId||''}')">Atender</button></div>
          </div>`).join('')}
        </div>

        <div class="review-item">
          <label>¿Qué cambió desde la última revisión?</label>
          <div class="qhint">Selecciona sólo lo que cambió. El formulario se adapta a tu respuesta.</div>
          <div class="chips">
            ${CHANGE_TOPICS.map(t=>`<button class="chip ${d.topics.includes(t)?'on':''}" onclick="toggleTopic('${t}')"><span class="bx">✓</span>${t}</button>`).join('')}
            <button class="chip ${d.nothing?'on':''}" onclick="toggleNothing()"><span class="bx">✓</span>Nada cambió</button>
          </div>
          ${inconsistent?`<div class="inconsist"><b>Inconsistencia detectada</b><p>Respondiste “nada cambió”, pero existen ${red.length} evento(s) que requerían actualización. Atiende los eventos marcados en rojo o indica qué cambió para poder confirmar la revisión.</p></div>`:''}
        </div>

        ${d.topics.includes('Cliente')?`<div class="review-item"><label>Clima del cliente</label>
          <div class="qhint">Alimenta la dimensión Cliente y el Health Gate de situación crítica.</div>
          <div class="segment">${CLIMATE.map(c=>`<button class="${d.climate===c?'active '+(c==='Bueno'?'green':c==='Con tensión'?'amber':'red'):''}" onclick="setDraft('climate','${c}')">${c}</button>`).join('')}</div></div>`:''}

        ${d.topics.includes('Finanzas')?`<div class="review-item"><label>Actualización financiera</label>
          <div class="qhint">Costo real acumulado y esfuerzo consumido a la fecha de la revisión.</div>
          <div class="form">
            <div class="field"><label>Costo real acumulado</label><input id="revCost" type="number" value="${d.cost!==null&&d.cost!==undefined?d.cost:(p.finance.cost||'')}" oninput="setDraftField('cost',this.value)"></div>
            <div class="field"><label>Esfuerzo consumido (h)</label><input id="revEffort" type="number" value="${d.effort!==null&&d.effort!==undefined?d.effort:(p.finance.effortActual||'')}" oninput="setDraftField('effort',this.value)"></div>
          </div></div>`:''}

        ${d.topics.includes('Alcance')?`<div class="review-item"><label>Cambio de alcance</label>
          <div class="qhint">Un cambio de alcance debe registrarse como Project Change para poder actualizar la línea base. Si no se aprueba, permanece como desviación.</div>
          <button class="btn small" onclick="openChangeModal()">Registrar Project Change</button></div>`:''}

        ${d.topics.includes('Riesgos')?`<div class="review-item"><label>Actualización de riesgos</label>
          <div class="qhint">Nueva probabilidad, nuevo deadline, mitigado, materializado o nueva acción.</div>
          <div class="chips">${openRisks(p).length?openRisks(p).map(r=>`<button class="chip" onclick="openRiskUpdate('${p.id}','${r.id}')">${esc(r.title)}</button>`).join(''):'<span class="note">No hay riesgos abiertos. Puedes registrar uno nuevo.</span>'}</div>
          <div style="margin-top:10px"><button class="btn small" onclick="openRiskModal()">Registrar riesgo</button></div></div>`:''}

        ${(d.topics.includes('Hitos')||d.topics.includes('Cronograma'))?`<div class="review-item"><label>Actualización de hitos</label>
          <div class="qhint">Confirma cumplimiento, reprograma o marca en curso.</div>
          <div class="chips">${p.milestones.filter(m=>!isDone(m)).length?p.milestones.filter(m=>!isDone(m)).map(m=>`<button class="chip" onclick="openMilestoneUpdate('${m.id}')">${esc(m.name)}</button>`).join(''):'<span class="note">No hay hitos abiertos.</span>'}</div>
          <div style="margin-top:10px"><button class="btn small" onclick="openMilestoneModal()">Agregar hito</button></div></div>`:''}

        ${d.topics.includes('Equipo')?`<div class="review-item"><label>Cambios en el equipo</label>
          <div class="qhint">Registra altas, bajas o cambios de asignación que afecten la continuidad.</div>
          <button class="btn small" onclick="openTeamModal()">Gestionar equipo</button></div>`:''}

        <div class="review-item"><label>Nivel de confianza declarado</label>
          <div class="qhint">Sugerido por el sistema: <b>${a.confidence.level}</b> (${a.confidence.value}/100) según actualidad, consistencia y soporte disponible.</div>
          <div class="segment">${['Alta','Media','Baja'].map(c=>`<button class="${(d.confidence||a.confidence.level)===c?'active '+(c==='Alta'?'green':c==='Media'?'amber':'red'):''}" onclick="setDraft('confidence','${c}')">${c}</button>`).join('')}</div></div>

        <div class="review-item"><label>Soporte de la revisión</label>
          <div class="qhint">Imagen (captura de correo, minuta, acta, tablero) y/o comentario textual. Sin sistema documental complejo.</div>
          <div class="form c1">
            <div class="field"><label>Comentario</label><textarea id="revSupport" placeholder="Qué ocurrió, decisiones tomadas, contexto relevante…" oninput="setDraftField('supportText',this.value)">${esc(d.supportText)}</textarea></div>
            <div class="field"><label>Imagen de soporte</label><input type="file" accept="image/*" onchange="readSupportImage(this)">
              ${d.supportImage?`<img class="evimg" src="${d.supportImage}" style="max-height:220px;object-fit:contain">
              <button class="btn tiny" style="margin-top:8px" onclick="setDraft('supportImage','')">Quitar imagen</button>`:'<div class="hint">Opcional. Se guarda localmente en el navegador.</div>'}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card span5">
      <div class="sectitle">Salud calculada con el estado vigente</div>
      <div class="healthbox">${ring(a.score)}<div class="healthcopy">
        <span class="pill ${healthClass(a.score)}"><span class="dot"></span>${healthLabel(a.score)}</span>
        <p style="margin-top:10px">Confianza <b>${a.confidence.level}</b> · Tendencia ${trend(p).arrow} ${trend(p).label}<br>
        ${a.active.length?`<span style="color:#b42318">${a.active.length} Health Gate(s) activo(s)</span>`:'Sin Health Gates activos'}</p></div></div>
      <div style="margin-top:20px">${dimsBlock(a)}</div>
      <div class="note" style="margin-top:18px"><b>Próximo ciclo:</b> al confirmar, la siguiente revisión se programará para ${p.cycle.cadence?dateFmt(nextByCadence(state.today,p.cycle.cadence)):'—'}.
      ${p.cycle.leaderValidation?'<br>La revisión quedará <b>pendiente de validación</b> del líder.':''}</div>
      <div style="margin-top:14px"><button class="btn small" onclick="go('health')">Ver evaluación completa</button></div>
    </div>

    <div class="card span12"><div class="toolbar"><div><h2>Revisiones anteriores</h2><div class="sub">Trazabilidad del ciclo de gobierno</div></div></div>
      ${p.reviews.length?reviewsTable(p):'<div class="empty sm"><h3>Sin revisiones registradas</h3></div>'}</div>
  </div>`;
};

views.health=function(){
  const p=selected(); if(!p)return noProject();
  const a=assess(p), t=trend(p), f=forecast(p);
  return `${pageHead('Health Assessment','Salud del proyecto','Compara la línea base vigente más los cambios aprobados contra el estado real. Score, dimensiones, gates, confianza, tendencia y pronóstico.',
    `<button class="btn" onclick="go('events')">Health Events</button><button class="btn primary" onclick="go('review')">Health Review</button>`)}
  <div class="grid">
    <div class="card span5"><div class="healthbox">${ring(a.score)}<div class="healthcopy">
      <span class="pill ${healthClass(a.score)}"><span class="dot"></span>${healthLabel(a.score)}</span>
      <h2>${esc(p.name)}</h2>
      <p>Promedio ponderado <b>${a.base}</b>${a.cap<100?` · limitado a <b>${a.cap}</b> por Health Gates`:''}<br>
      Confianza <b>${a.confidence.level}</b> (${a.confidence.value}/100)</p></div></div>
      <div class="statline c3" style="margin-top:20px">
        <div class="stat"><b class="trend ${t.dir}">${t.arrow}</b><span>${esc(t.label)}${t.delta?` (${t.delta>0?'+':''}${t.delta})`:''}</span></div>
        <div class="stat ${a.deviation>10?'red':''}"><b>${fmtPct(a.deviation)}</b><span>Desviación de proyecto</span></div>
        <div class="stat ${a.financial!==null&&a.financial>3?'red':''}"><b>${a.financial===null?'s/d':fmtPct(a.financial)}</b><span>Desviación financiera</span></div>
      </div>
    </div>
    <div class="card span7"><div class="toolbar"><div><h2>Dimensiones de salud</h2><div class="sub">Explican por qué el proyecto está sano o deteriorándose. “s/d” = sin dato suficiente (afecta la confianza, no el score).</div></div></div>
      ${dimsBlock(a)}
    </div>

    <div class="card span7"><div class="toolbar"><div><h2>Health Gates</h2><div class="sub">Reglas críticas que limitan el score independientemente del promedio</div></div></div>
      ${gatesBlock(a,p)}
    </div>
    <div class="card span5"><div class="toolbar"><div><h2>Health Confidence</h2><div class="sub">¿Qué tan confiable es la información?</div></div>
      <span class="pill ${a.confidence.class}">${a.confidence.level}</span></div>
      <div class="bar" style="height:9px"><i style="width:${a.confidence.value}%;background:${healthColor(a.confidence.value)}"></i></div>
      <dl class="kv" style="margin-top:18px">
        <dt>Última revisión</dt><dd>${p.cycle.last?`${dateFmt(p.cycle.last)} (${daysSinceReview(p)} días)`:'Nunca'}</dd>
        <dt>Cadencia</dt><dd>${p.cycle.cadence||'sin definir'}</dd>
        <dt>Dimensiones sin dato</dt><dd>${a.dims.filter(d=>d.score===null).length}</dd>
        <dt>Eventos esperados abiertos</dt><dd>${expectations(p).length}</dd>
        <dt>Línea base</dt><dd>${currentBaseline(p)?'v'+currentBaseline(p).version:'no definida'}</dd>

/* =========================================================
   VISTA — HEALTH TIMELINE
   ========================================================= */
views.timeline=function(){
  const p=selected(); if(!p)return noProject();
  const cad=cadenceDays(p.cycle.cadence||'Quincenal');
  const limit=addDays(state.today,cad*(p.cycle.forecastCycles||2));
  const past=[], present=[], future=[];
  p.milestones.forEach(m=>{
    const d=daysUntil(m.date);
    if(isDone(m))past.push({t:`Hito cumplido: ${m.name}`,s:`${dateFmt(m.completedDate||m.date)}${m.completedDate&&m.completedDate>m.date?' · fuera de fecha':''}`,lvl:m.completedDate&&m.completedDate>m.date?'amber':'green'});
    else if(d<0)present.push({t:`Hito vencido: ${m.name}`,s:`Compromiso ${dateFmt(m.date)} · ${relDays(d)}`,lvl:'red'});
    else if(m.date<=limit)future.push({t:`Hito próximo: ${m.name}`,s:`${dateFmt(m.date)} · ${relDays(d)}`,lvl:d<=3?'amber':'blue'});
    else future.push({t:`Hito: ${m.name}`,s:`${dateFmt(m.date)}`,lvl:'blue'});
  });
  p.risks.forEach(r=>{
    const d=daysUntil(r.deadline);
    if(['Mitigado','Cerrado'].includes(r.status))past.push({t:`Riesgo ${r.status.toLowerCase()}: ${r.title}`,s:dateFmt(r.deadline),lvl:'green'});
    else if(r.status==='Materializado')present.push({t:`Riesgo materializado: ${r.title}`,s:`Impacto ${r.impact}`,lvl:'red'});
    else if(d!==null&&d<0)present.push({t:`Mitigación vencida: ${r.title}`,s:`Deadline ${dateFmt(r.deadline)} · ${relDays(d)}`,lvl:'red'});
    else present.push({t:`Riesgo abierto: ${r.title}`,s:`Severidad ${riskSeverity(r)} · deadline ${dateFmt(r.deadline)}`,lvl:riskLevel(r)});
  });
  openTasks(p).forEach(t=>{
    const d=daysUntil(t.deadline);
    if(d!==null&&d<0)present.push({t:`Acción vencida: ${t.title}`,s:`${t.owner} · ${relDays(d)}`,lvl:'red'});
    else present.push({t:`Acción pendiente: ${t.title}`,s:`${t.owner} · ${dateFmt(t.deadline)}`,lvl:'amber'});
  });
  p.reviews.slice(0,6).forEach(r=>past.push({t:`Health Review ${r.id}`,s:`${dateFmt(r.date)} · score ${r.health} · ${r.status}`,lvl:'blue'}));
  p.changes.forEach(c=>{
    if(c.status==='Aprobado')past.push({t:`Cambio aprobado: ${c.title}`,s:`${dateFmt(c.decidedDate||c.date)} · baseline v${c.baselineVersion||'—'}`,lvl:'amber'});
    else if(c.status==='Propuesto')present.push({t:`Cambio pendiente: ${c.title}`,s:`Registrado ${dateFmt(c.date)}`,lvl:'amber'});
  });
  if(p.cycle.next){const d=daysUntil(p.cycle.next);
    (d<0?present:future).push({t:'Health Review programada',s:`${dateFmt(p.cycle.next)} · ${relDays(d)}`,lvl:d<0?'red':'blue'})}
  if(p.renewal.date){const d=daysUntil(p.renewal.date);
    (d<0?present:future).push({t:'Renovación / vencimiento',s:`${dateFmt(p.renewal.date)} · ${relDays(d)}`,lvl:d<0?'red':d<=45?'amber':'blue'})}
  if(p.end)future.push({t:'Fin comprometido del servicio',s:`${dateFmt(p.end)} · ${relDays(daysUntil(p.end))}`,lvl:'blue'});

  const col=(title,sub,items)=>`<div class="tl-col"><h3>${title}</h3><div class="sub">${sub}</div>
    ${items.length?items.map(i=>`<div class="tl-item"><b>${esc(i.t)}</b><span>${esc(i.s)}</span></div>`).join(''):'<div class="tl-item"><span>Sin elementos</span></div>'}</div>`;

  return `${pageHead('Health Timeline','Cronología del proyecto','Ordena el proyecto en el tiempo para observar pasado, presente y próximos ciclos. Habilita anticipación y seguimiento sistemático de compromisos.')}
  <div class="grid">
    <div class="card span12"><div class="tl-cols">
      ${col('Pasado','Hitos cumplidos, cambios, riesgos cerrados y reviews',past)}
      ${col('Presente','Estado actual, riesgos abiertos y acciones pendientes',present)}
      ${col('Futuro',`Próximos ${p.cycle.forecastCycles||2} ciclo(s) · hasta ${dateFmt(limit)}`,future)}
    </div></div>
    <div class="card span12"><div class="toolbar"><div><h2>Historial de eventos del proyecto</h2><div class="sub">Secuencia temporal de cambios importantes</div></div></div>
      ${p.log.length?`<div class="timeline">${p.log.slice(0,50).map(e=>`<div class="event ${e.level==='red'?'red':e.level==='amber'?'amber':e.level==='green'?'green':''}">
        <div class="when">${dateFmt(e.date)} · ${esc(e.kind)}</div><b>${esc(e.text)}</b></div>`).join('')}</div>`:'<div class="empty sm"><h3>Sin actividad registrada</h3></div>'}
    </div>
  </div>`;
};

function validProject(d){
  const miss=[];
  if(!d.name)miss.push('nombre');if(!d.type)miss.push('tipo');if(!d.client)miss.push('cliente');
  if(!d.start)miss.push('inicio');if(!d.end)miss.push('fin');if(!d.pm)miss.push('PM');
  if(!d.leader)miss.push('líder');if(!d.technical)miss.push('responsable técnico');
  if(miss.length){toast('Faltan campos obligatorios: '+miss.join(', '));return false}
  if(d.end<d.start){toast('La fecha de fin no puede ser anterior al inicio');return false}
  return true;

function saveBaseline(reason,silent){
  const p=selected(); const prev=currentBaseline(p);
  const r=reason||v('bReason')||(prev?'':'Línea base inicial');
  if(prev&&!r){toast('Indica el motivo de la nueva línea base');return}
  if(prev)prev.status='Histórica';
  const b={version:prev?prev.version+1:1,date:state.today,status:'Vigente',
    start:v('bStart')||p.start,end:v('bEnd')||p.end,effort:vnum('bEffort'),budget:vnum('bBudget'),
    scope:v('bScope'),team:v('bTeam'),reason:r,milestones:p.milestones.length};
  p.baselines.push(b);
  if(b.budget!==null)p.finance.budget=b.budget;
  if(b.effort!==null)p.finance.effortPlanned=b.effort;
  if(b.end)p.end=b.end;
  p.milestones.forEach(m=>{if(!m.baselineDate)m.baselineDate=m.date});
  logEvent(p,'Baseline',`Línea base v${b.version} vigente. ${r}`,'blue');
  if(!silent){closeModal(); render(); toast('Línea base v'+b.version+' registrada')}
  return b;
}

  const m={id:uid('M'),name,deliverable:v('mDeliverable'),date,baselineDate:date,owner,
    status:v('mStatus')||'Pendiente',critical:v('mCritical')==='si',evidence:false,evidenceText:'',evidenceImage:'',

function updateMilestone(id){
  const p=selected(),m=p.milestones.find(x=>x.id===id);
  const name=v('mName'),date=v('mDate'),owner=v('mOwner');
  if(!name||!date||!owner){toast('Completa nombre, fecha compromiso y responsable');return}
  if(date!==m.date)m.history.unshift({date:state.today,text:`Fecha compromiso movida de ${dateFmt(m.date)} a ${dateFmt(date)}.`});
  Object.assign(m,{name,deliverable:v('mDeliverable'),date,owner,status:v('mStatus'),critical:v('mCritical')==='si'});
  if(m.status==='Cumplido'&&!m.completedDate)m.completedDate=state.today;

  closeModal(); render(); toast('Hito actualizado');
}
function openMilestoneUpdate(id){
  const p=selected(),m=p.milestones.find(x=>x.id===id); if(!m)return;
  msImageBuffer='';
  const overdue=isOverdue(m);
  modal(`<div class="kicker">Health Review · tratamiento de evento</div><h2>Actualizar hito</h2>
  <div class="desc"><b>${esc(m.name)}</b> · compromiso ${dateFmt(m.date)} ${overdue?`<span class="pill red">Vencido ${relDays(daysUntil(m.date))}</span>`:''}<br>
  ${overdue?'El sistema requiere estado, nueva fecha y soporte para poder cerrar el evento.':'Confirma el estado del compromiso.'}</div>
  <div class="form">
    <div class="field"><label>Estado <span class="req">*</span></label><select id="muStatus">${MILESTONE_STATUS.filter(s=>s!=='Vencido').map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>Nueva fecha compromiso</label><input id="muDate" type="date" value="${m.date}"></div>
    <div class="field full"><label>Soporte / comentario ${p.cycle.evidenceRequired?'<span class="req">*</span>':''}</label>
      <textarea id="muEvidence" placeholder="Minuta, correo, acuerdo con el cliente, causa del desfase…">${esc(m.evidenceText||'')}</textarea></div>
    <div class="field full"><label>Imagen de soporte</label><input type="file" accept="image/*" onchange="readMsImage(this)">
      <div id="msImgPrev">${m.evidenceImage?`<img class="evimg" src="${m.evidenceImage}" style="max-height:160px;object-fit:contain">`:''}</div></div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveMilestoneUpdate('${m.id}')">Guardar actualización</button></div>
  </div>`);
}
let msImageBuffer='';
function readMsImage(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{msImageBuffer=e.target.result;byId('msImgPrev').innerHTML=`<img class="evimg" src="${msImageBuffer}" style="max-height:160px;object-fit:contain">`};
  r.readAsDataURL(f);
}
function saveMilestoneUpdate(id){
  const p=selected(),m=p.milestones.find(x=>x.id===id);
  const st=v('muStatus'),nd=v('muDate'),ev=v('muEvidence');
  if(p.cycle.evidenceRequired&&(st==='Cumplido'||nd!==m.date)&&!ev&&!msImageBuffer){
    toast('El ciclo exige soporte para cerrar o reprogramar un hito');return;
  }
  if(nd!==m.date){
    const approved=p.changes.some(c=>c.status==='Aprobado'&&(c.areas||[]).includes('Hitos')&&c.decidedDate===state.today);
    m.history.unshift({date:state.today,text:`Reprogramado de ${dateFmt(m.date)} a ${dateFmt(nd)}${approved?' (cambio aprobado)':' (sin cambio aprobado: cuenta como desviación)'}.`});
    m.date=nd; m.approvedChange=approved;
    if(st!=='Cumplido')m.status='Reprogramado';
  }
  if(st==='Cumplido'){m.status='Cumplido';m.completedDate=state.today;m.history.unshift({date:state.today,text:'Hito marcado como cumplido.'})}
  else if(nd===m.date){m.status=st;m.history.unshift({date:state.today,text:`Estado actualizado a ${st}.`})}
  if(ev){m.evidenceText=ev;m.evidence=true}
  if(msImageBuffer){m.evidenceImage=msImageBuffer;m.evidence=true;msImageBuffer=''}
  logEvent(p,'Hito',`${m.name}: ${m.status}${m.status==='Reprogramado'?` · nueva fecha ${dateFmt(m.date)}`:''}.`,m.status==='Cumplido'?'green':'amber');
  closeModal(); render(); toast('Hito actualizado');
}

function saveRiskUpdate(pid,rid){
  const p=state.projects.find(x=>x.id===pid),r=p.risks.find(x=>x.id===rid);
  const note=v('ruNote');
  if(!note){toast('Registra un comentario de seguimiento');return}
  const before={status:r.status,probability:r.probability,impact:r.impact,deadline:r.deadline};
  r.status=v('ruStatus');r.probability=v('ruProb');r.impact=v('ruImpact');r.deadline=v('ruDeadline');r.mitigation=v('ruMitigation');
  const chg=[];
  if(before.status!==r.status)chg.push(`estado ${before.status} → ${r.status}`);
  if(before.probability!==r.probability)chg.push(`probabilidad ${before.probability} → ${r.probability}`);
  if(before.impact!==r.impact)chg.push(`impacto ${before.impact} → ${r.impact}`);
  if(before.deadline!==r.deadline)chg.push(`deadline ${dateFmt(before.deadline)} → ${dateFmt(r.deadline)}`);
  r.history.unshift({date:state.today,text:note+(chg.length?` · ${chg.join(', ')}`:'')});
  logEvent(p,'Riesgo',`Seguimiento de ${r.title}${chg.length?': '+chg.join(', '):''}.`,r.status==='Materializado'?'red':r.status==='Mitigado'?'green':'amber');
  if(r.status==='Materializado')logEvent(p,'Health Event',`Riesgo materializado: ${r.title}.`,'red');
  closeModal(); render(); toast('Seguimiento registrado');
}

function createChange(){

  if(!title||!ctype||!areas.length){toast('Indica título, origen y al menos un área afectada');return}

    newEnd:v('cEnd'),description:v('cDesc'),date:state.today,status:'Propuesto',baselineVersion:null};

function decideChange(id,decision){
  const p=selected(),c=p.changes.find(x=>x.id===id); if(!c)return;
  modal(`<div class="kicker">Change Approval</div><h2>${decision==='Aprobado'?'Aprobar cambio':'Rechazar cambio'}</h2>
  <div class="desc"><b>${esc(c.title)}</b><br>${decision==='Aprobado'
    ?'Al aprobar se creará la <b>Baseline v'+((currentBaseline(p)?currentBaseline(p).version:0)+1)+'</b> con los impactos declarados. Los hitos abiertos se recorrerán si el cambio afecta tiempo o hitos.'
    :'El cambio queda registrado como rechazado. Cualquier diferencia con la línea base seguirá contando como desviación.'}</div>
  <div class="form">
    <div class="field full"><label>Comentario de la decisión</label><textarea id="dcComment"></textarea></div>
    <div class="field"><label>Decidido por</label><input id="dcBy" value="${esc(p.leader)}"></div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn ${decision==='Aprobado'?'primary':'danger'}" onclick="applyChangeDecision('${id}','${decision}')">${decision==='Aprobado'?'Aprobar y crear baseline':'Rechazar cambio'}</button></div>
  </div>`,'small');
}
function applyChangeDecision(id,decision){
  const p=selected(),c=p.changes.find(x=>x.id===id); if(!c)return;
  c.status=decision; c.decidedDate=state.today; c.decidedBy=v('dcBy')||p.leader; c.decisionComment=v('dcComment');
  if(decision==='Aprobado'){
    const prev=currentBaseline(p);
    if(prev)prev.status='Histórica';
    const newEnd=c.newEnd||(c.days?addDays(prev?prev.end:p.end,c.days):(prev?prev.end:p.end));
    const b={version:prev?prev.version+1:1,date:state.today,status:'Vigente',
      start:prev?prev.start:p.start,end:newEnd,
      effort:(prev&&prev.effort?prev.effort:(p.finance.effortPlanned||0))+(c.effort||0),
      budget:(prev&&prev.budget!=null?Number(prev.budget):(p.finance.budget||0))+(c.cost||0),
      scope:(prev&&prev.scope?prev.scope+'\n':'')+`[v${(prev?prev.version+1:1)}] ${c.title}: ${c.description||''}`,
      team:prev?prev.team:p.team.map(t=>t.name).join(', '),
      reason:`Cambio aprobado ${c.id} — ${c.title}`,milestones:p.milestones.length};
    p.baselines.push(b); c.baselineVersion=b.version;
    p.end=b.end; p.finance.budget=b.budget; p.finance.effortPlanned=b.effort;
    if(c.days&&(c.areas.includes('Tiempo')||c.areas.includes('Hitos'))){
      p.milestones.filter(m=>!isDone(m)).forEach(m=>{
        const nd=addDays(m.date,c.days);
        m.history.unshift({date:state.today,text:`Fecha recorrida ${dateFmt(m.date)} → ${dateFmt(nd)} por cambio aprobado ${c.id}.`});
        m.date=nd; m.baselineDate=nd; m.approvedChange=true;
        if(m.status==='Reprogramado')m.status='Pendiente';
      });
    }
    logEvent(p,'Cambio',`Cambio “${c.title}” aprobado · Baseline v${b.version} vigente.`,'green');
    logEvent(p,'Baseline',`Nueva línea base v${b.version} generada por cambio aprobado.`,'blue');
  }else{
    logEvent(p,'Cambio',`Cambio “${c.title}” rechazado por ${c.decidedBy}.`,'amber');
  }
  closeModal(); snapshotScores('cambio'); render();
  toast(decision==='Aprobado'?'Cambio aprobado · nueva línea base':'Cambio rechazado');
}

function saveTaskUpdate(pid,tid){

  const note=v('tuNote'),st=v('tuStatus');
  if(!note){toast('Registra un comentario de seguimiento');return}
  const before=t.status;
  t.status=st;t.owner=v('tuOwner');t.deadline=v('tuDeadline');t.priority=v('tuPriority');
  t.history.unshift({date:state.today,text:note+(before!==st?` · estado ${before} → ${st}`:'')});
  if(st==='Completada'){
    t.closedDate=state.today;t.closure=note;

    logEvent(p,'Health Action',`Acción cerrada: ${t.title}.`,'green');

}

function toggleTopic(t){
  const p=selected();ensureDraft(p);

  const i=draft.topics.indexOf(t);
  if(i>=0)draft.topics.splice(i,1);else draft.topics.push(t);

function toggleNothing(){
  const p=selected();ensureDraft(p);
